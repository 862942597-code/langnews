<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>多行业语言精读 · 每日更新</title>
  <link rel="manifest" href="/manifest.json">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', 'Hiragino Sans', 'Yu Gothic', sans-serif;
      background: #f5f7fb; color: #1e293b; padding: 16px; line-height: 1.7;
    }
    .app-container { max-width: 800px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
    h1 {
      font-size: 1.8rem; font-weight: 700;
      background: linear-gradient(135deg, #0f766e, #3b82f6);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .header-sub { font-size: 0.9rem; color: #64748b; margin-top: -12px; }
    .update-badge { font-size: 0.7rem; background: #dcfce7; color: #166534; padding: 4px 10px; border-radius: 20px; display: inline-block; margin-top: 4px; }
    .card { background: white; border-radius: 24px; padding: 20px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); }
    .lang-tabs { display: flex; gap: 8px; margin-bottom: 16px; }
    .lang-tab { flex: 1; text-align: center; padding: 10px; background: #f1f5f9; border-radius: 40px; font-weight: 600; font-size: 0.9rem; color: #475569; cursor: pointer; border: 2px solid transparent; }
    .lang-tab.active { background: white; border-color: #0f766e; color: #0f766e; }
    .topic-tabs { display: flex; gap: 6px; margin-bottom: 16px; flex-wrap: wrap; }
    .topic-tab { padding: 8px 16px; background: #f1f5f9; border-radius: 40px; font-weight: 600; font-size: 0.8rem; color: #475569; cursor: pointer; border: 2px solid transparent; }
    .topic-tab.active { background: white; border-color: #0f766e; color: #0f766e; }
    .news-item { border-bottom: 1px solid #e2e8f0; padding: 20px 0; }
    .news-item:last-child { border-bottom: none; }
    .news-title { font-weight: 700; font-size: 1.2rem; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 8px; }
    .news-meta { font-size: 0.7rem; color: #64748b; background: #f1f5f9; padding: 2px 12px; border-radius: 20px; white-space: nowrap; }
    .news-content { font-size: 0.95rem; color: #1e293b; margin: 12px 0 16px; line-height: 1.8; max-height: 500px; overflow-y: auto; padding-right: 4px; }
    .action-buttons { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
    button {
      background: white; border: 1px solid #cbd5e1; border-radius: 30px; padding: 8px 16px;
      font-size: 0.8rem; font-weight: 500; color: #1e293b; display: inline-flex; align-items: center; gap: 5px;
      cursor: pointer; transition: all 0.2s; background: #f8fafc;
    }
    button:hover { background: #e2e8f0; }
    button.primary { background: #0f766e; border-color: #0f766e; color: white; }
    button.primary:hover { background: #115e59; }
    .translation-box { background: #f0fdf9; border-radius: 16px; padding: 14px; margin: 12px 0; font-size: 0.9rem; color: #0f766e; border-left: 4px solid #0f766e; max-height: 400px; overflow-y: auto; }
    .vocab-highlight { background: #fef9c3; padding: 0 2px; border-radius: 4px; cursor: pointer; font-weight: 500; border-bottom: 1px dashed #ca8a04; }
    .grammar-highlight { color: #2563eb; border-bottom: 1px dashed #2563eb; cursor: pointer; font-weight: 500; }
    .exercise-block { background: #f8fafc; border-radius: 16px; padding: 16px; margin-top: 12px; }
    .quiz-option { display: block; width: 100%; text-align: left; margin: 8px 0; background: #ffffff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 12px; font-weight: 500; }
    .quiz-option.correct { background: #dcfce7; border-color: #22c55e; }
    .quiz-option.wrong { background: #fee2e2; border-color: #ef4444; }
    .popup-word { position: fixed; top: 20%; left: 50%; transform: translate(-50%,-20%); background: white; border-radius: 20px; padding: 20px; box-shadow: 0 20px 40px rgba(0,0,0,0.2); z-index: 999; max-width: 90%; width: 350px; display: none; }
    .popup-word .close { float: right; background: none; border: none; font-size: 1.5rem; cursor: pointer; }
    .loading-spinner { text-align: center; padding: 40px; color: #64748b; }
    .footer-note { text-align: center; font-size: 0.75rem; color: #94a3b8; }
    @media (max-width: 480px) { body { padding: 10px; } .card { padding: 16px; } }
  </style>
</head>
<body>
<div class="app-container">
  <div>
    <h1>🌐 多行业语言精读</h1>
    <div class="header-sub">新能源 · 智能家居 · 3D打印/激光雕刻 · AI</div>
    <span class="update-badge" id="updateBadge">📡 加载中...</span>
  </div>

  <div class="lang-tabs">
    <div class="lang-tab active" id="tabJapanese">🇯🇵 日本語</div>
    <div class="lang-tab" id="tabEnglish">🇺🇸 English</div>
  </div>

  <div class="topic-tabs" id="topicTabs">
    <div class="topic-tab active" data-topic="battery">🔋 新能源电池</div>
    <div class="topic-tab" data-topic="smarthome">🏠 智能家居</div>
    <div class="topic-tab" data-topic="3dprint">🖨️ 3D打印/激光雕刻</div>
    <div class="topic-tab" data-topic="ai">🤖 人工智能</div>
  </div>

  <div id="newsContainer" class="card">
    <div class="loading-spinner">⏳ 正在加载今日新闻...</div>
  </div>

  <div class="footer-note">
    💡 单击<strong>任意单词</strong>查词典 · 选中文本自动查询 · 单击<strong style="color:#2563eb;">蓝色下划线</strong>看语法 · 练习分简单/中等/困难
  </div>
</div>

<div class="popup-word" id="wordPopup">
  <button class="close" onclick="document.getElementById('wordPopup').style.display='none'">&times;</button>
  <div id="wordContent">查询中...</div>
</div>

<script>
  (function() {
    // ========== 术语库（供高亮和练习使用）==========
    const glossary = {
      "全固体電池":"全固态电池, 使用固体电解质的下一代电池","量産":"量产, 大规模生产","固体電解質":"固体电解质",
      "エネルギー密度":"能量密度","航続距離":"续航里程","充電時間":"充电时间","イオン伝導率":"离子电导率",
      "界面抵抗":"界面电阻","試作":"试制","クロスライセンス":"交叉许可",
      "スマートホーム":"智能家居","AIスピーカー":"AI音箱","省エネ":"节能","HEMS":"家庭能源管理系统",
      "Matter規格":"Matter标准, 智能家居互联协议","顔認証":"人脸识别","スマートロック":"智能门锁",
      "3Dプリンティング":"3D打印","積層造形":"增材制造","レーザー彫刻":"激光雕刻",
      "ハイブリッド加工機":"混合加工机","リードタイム":"交付周期","STEAM教育":"STEAM教育",
      "生成AI":"生成式AI","大規模言語モデル":"大型语言模型","オンデバイスAI":"设备端AI",
      "DOE":"美国能源部","Bipartisan Infrastructure Law":"两党基础设施法",
      "lithium processing":"锂加工","graphite":"石墨","solid-state":"固态(电池)","consortium":"联盟",
      "end-to-end":"端到端","Matter":"Matter协议","interoperability":"互操作性",
      "facial recognition":"人脸识别","additive manufacturing":"增材制造",
      "laser powder bed fusion":"激光粉末床熔融","photopolymers":"光聚合物",
      "mass customization":"大规模定制","generative AI":"生成式AI","on-device AI":"设备端AI","privacy":"隐私"
    };

    let currentLang = 'japanese';
    let currentTopic = 'battery';
    let translationCache = {};
    let newsDB = null;  // 从 /api/news 加载

    const newsContainer = document.getElementById('newsContainer');
    const tabJapanese = document.getElementById('tabJapanese');
    const tabEnglish = document.getElementById('tabEnglish');
    const topicTabs = document.querySelectorAll('#topicTabs .topic-tab');

    // ========== 翻译 ==========
    async function translateText(text, sourceLang, targetLang = 'zh-CN') {
      const cacheKey = `${text}|${sourceLang}|${targetLang}`;
      if (translationCache[cacheKey]) return translationCache[cacheKey];
      const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${sourceLang}|${targetLang}`;
      try {
        const res = await fetch(url); const data = await res.json();
        if (data.responseStatus === 200) { translationCache[cacheKey] = data.responseData.translatedText; return data.responseData.translatedText; }
        return `[翻译失败]`;
      } catch (e) { return `[网络错误]`; }
    }

    // ========== 朗读（已优化）==========
    function speakText(text, lang) {
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      const langMap = { japanese: 'ja-JP', english: 'en-US', chinese: 'zh-CN' };
      utterance.lang = langMap[lang] || 'en-US';
      utterance.rate = 0.9;
      utterance.volume = 1;
      function trySpeak() {
        let voices = window.speechSynthesis.getVoices();
        if (lang === 'japanese') {
          const jaVoice = voices.find(v => v.lang.startsWith('ja') && (v.name.includes('Google') || v.name.includes('Kyoko')));
          if (jaVoice) utterance.voice = jaVoice;
        } else if (lang === 'english') {
          const enVoice = voices.find(v => v.lang.startsWith('en') && v.name.includes('Google'));
          if (enVoice) utterance.voice = enVoice;
        }
        window.speechSynthesis.speak(utterance);
      }
      if (window.speechSynthesis.getVoices().length === 0) {
        window.speechSynthesis.onvoiceschanged = () => { trySpeak(); };
      } else {
        trySpeak();
      }
    }

    // ========== 语法高亮 ==========
    function highlightGrammar(text, lang) {
      if (lang === 'japanese') {
        return text
          .replace(/により/g, '<span class="grammar-highlight" data-grammar="により：表示原因、手段">により</span>')
          .replace(/ため/g, '<span class="grammar-highlight" data-grammar="ため：表示目的或原因">ため</span>')
          .replace(/見込み/g, '<span class="grammar-highlight" data-grammar="見込み：预期，预计">見込み</span>')
          .replace(/向け/g, '<span class="grammar-highlight" data-grammar="向け：面向…，针对…">向け</span>')
          .replace(/として/g, '<span class="grammar-highlight" data-grammar="として：作为…，以…身份">として</span>')
          .replace(/という/g, '<span class="grammar-highlight" data-grammar="という：所谓的…，听说…">という</span>')
          .replace(/だけでなく/g, '<span class="grammar-highlight" data-grammar="だけでなく：不仅…而且…">だけでなく</span>')
          .replace(/可能にする/g, '<span class="grammar-highlight" data-grammar="可能にする：使…成为可能">可能にする</span>');
      } else {
        return text
          .replace(/\bwill be\b/gi, '<span class="grammar-highlight" data-grammar="将来被动语态">will be</span>')
          .replace(/\b(announced|pledged|finalized|expected|projected)\b/gi, '<span class="grammar-highlight" data-grammar="新闻被动语态">$1</span>')
          .replace(/\b(aiming to|focusing on|strengthening)\b/gi, '<span class="grammar-highlight" data-grammar="现在分词表目的">$1</span>')
          .replace(/\b(according to|in line with|in response to)\b/gi, '<span class="grammar-highlight" data-grammar="复合介词">$1</span>')
          .replace(/\b(due to|because of)\b/gi, '<span class="grammar-highlight" data-grammar="表原因">$1</span>')
          .replace(/\b(not only|but also)\b/gi, '<span class="grammar-highlight" data-grammar="不仅…而且…">$1</span>');
      }
    }

    // ========== 词典查询（通过云函数代理）==========
    async function lookupWord(word, lang) {
      const popup = document.getElementById('wordPopup');
      popup.style.display = 'block';
      document.getElementById('wordContent').innerHTML = `<p>查询中...</p>`;
      try {
        const langCode = lang === 'japanese' ? 'ja' : 'en';
        const res = await fetch(`/api/dictionary?word=${encodeURIComponent(word)}&lang=${langCode}`);
        const data = await res.json();
        if (data.error) { showWordPopup('❌', '未找到该词'); return; }
        if (lang === 'japanese') {
          if (data.data && data.data.length > 0) {
            const entry = data.data[0];
            const readings = entry.japanese[0].reading || '';
            const meanings = entry.senses[0].english_definitions.join(', ');
            showWordPopup(`📖 ${word}`, `読み: ${readings}<br>意味: ${meanings}`);
          } else { showWordPopup('❌', '未找到'); }
        } else {
          if (data && data[0]) {
            showWordPopup(`📖 ${word}`, data[0].meanings[0].definitions[0].definition);
          } else { showWordPopup('❌', '未找到'); }
        }
      } catch (e) { showWordPopup('❌', '查询失败，请检查网络'); }
    }

    function showWordPopup(title, content) {
      document.getElementById('wordContent').innerHTML = `<h3>${title}</h3><p>${content}</p>`;
      document.getElementById('wordPopup').style.display = 'block';
    }

    // ========== 渲染新闻 ==========
    function renderNews(newsList, lang) {
      if (!newsList || newsList.length === 0) {
        newsContainer.innerHTML = '<div class="loading-spinner">📭 暂无新闻，请稍后刷新</div>';
        return;
      }
      let html = '';
      newsList.forEach(item => {
        const titleWithGrammar = highlightGrammar(item.title, lang);
        html += `
          <div class="news-item" data-id="${item.id}">
            <div class="news-title"><span>${titleWithGrammar}</span><span class="news-meta">${item.source}</span></div>
            <div class="news-content" id="content-${item.id}"></div>
            <div class="action-buttons">
              <button onclick="appActions.speak('${escapeHtml(item.content)}', '${lang}')">🔊 朗读</button>
              <button class="primary" id="transBtn-${item.id}" onclick="appActions.translateNews('${item.id}', '${escapeHtml(item.content)}', '${lang}')">🌐 翻译</button>
              <button onclick="appActions.showExercise('${item.id}')">📝 练习</button>
            </div>
            <div id="translation-${item.id}" class="translation-box" style="display:none;"></div>
            <div id="exercise-${item.id}" class="exercise-block" style="display:none;"></div>
          </div>`;
      });
      newsContainer.innerHTML = html;

      newsList.forEach(item => {
        const contentDiv = document.getElementById(`content-${item.id}`);
        if (!contentDiv) return;
        let text = item.content;
        let htmlText = highlightGrammar(text, lang);
        Object.keys(glossary).forEach(term => {
          if (glossary[term]) {
            const regex = new RegExp(`(${term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'g');
            htmlText = htmlText.replace(regex, `<span class="vocab-highlight" data-term="${escapeHtml(term)}">$1</span>`);
          }
        });
        contentDiv.innerHTML = htmlText;
      });

      // 点击事件：语法、术语、选中文本查询
      document.querySelectorAll('.news-content').forEach(div => {
        div.addEventListener('click', function(e) {
          const target = e.target;
          if (target.classList.contains('grammar-highlight')) {
            showWordPopup('📘 语法', target.getAttribute('data-grammar'));
            e.stopPropagation(); return;
          }
          if (target.classList.contains('vocab-highlight')) {
            const term = target.getAttribute('data-term');
            showWordPopup(`📖 ${term}`, glossary[term] || '暂无解释');
            e.stopPropagation(); return;
          }
          const selection = window.getSelection();
          if (selection.rangeCount > 0) {
            const selectedText = selection.toString().trim();
            if (selectedText && selectedText.length > 1) {
              lookupWord(selectedText, currentLang);
            }
          }
        });
      });
    }

    function escapeHtml(text) {
      return text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
    }

    // ========== 练习模块 ==========
    window.appActions = {
      speak(text, lang) { speakText(text, lang); },
      async translateNews(newsId, text, lang) {
        const btn = document.getElementById(`transBtn-${newsId}`);
        const div = document.getElementById(`translation-${newsId}`);
        if (div.style.display === 'block') { div.style.display = 'none'; btn.textContent = '🌐 翻译'; return; }
        btn.textContent = '⏳ 翻译中...'; btn.disabled = true;
        const source = lang === 'japanese' ? 'ja' : 'en';
        const translated = await translateText(text, source);
        div.innerHTML = '🇨🇳 ' + translated;
        div.style.display = 'block';
        const sbtn = document.createElement('button'); sbtn.textContent = '🔊 朗读中文'; sbtn.style.marginTop='8px';
        sbtn.onclick = () => speakText(translated, 'chinese'); div.appendChild(sbtn);
        btn.textContent = '🌐 隐藏翻译'; btn.disabled = false;
      },
      showExercise(newsId) {
        const exerciseDiv = document.getElementById(`exercise-${newsId}`);
        if (exerciseDiv.style.display === 'block') { exerciseDiv.style.display = 'none'; return; }
        let newsItem = null;
        for (let topic in newsDB[currentLang]) {
          const found = newsDB[currentLang][topic].find(n => n.id === newsId);
          if (found) { newsItem = found; break; }
        }
        if (!newsItem) return;
        const text = newsItem.content;
        const matchedTerms = Object.keys(glossary).filter(term => text.includes(term));
        if (matchedTerms.length < 2) {
          exerciseDiv.innerHTML = '<p>术语不足，无法出题。</p>';
          exerciseDiv.style.display = 'block'; return;
        }
        exerciseDiv.innerHTML = `
          <div>
            <button onclick="appActions.startExercise('${newsId}','easy')">⭐ 简单</button>
            <button onclick="appActions.startExercise('${newsId}','medium')">⭐⭐ 中等</button>
            <button onclick="appActions.startExercise('${newsId}','hard')">⭐⭐⭐ 困难</button>
          </div>
          <div id="exercise-area-${newsId}">请选择难度</div>`;
        exerciseDiv.style.display = 'block';
      },
      startExercise(newsId, level) {
        const area = document.getElementById(`exercise-area-${newsId}`);
        let newsItem = null;
        for (let topic in newsDB[currentLang]) {
          const found = newsDB[currentLang][topic].find(n => n.id === newsId);
          if (found) { newsItem = found; break; }
        }
        if (!newsItem) return;
        const text = newsItem.content;
        const matchedTerms = Object.keys(glossary).filter(term => text.includes(term));
        if (matchedTerms.length < 2) return;
        const term = matchedTerms[Math.floor(Math.random() * matchedTerms.length)];
        const correctDef = glossary[term];

        if (level === 'easy') {
          const opts = [correctDef, ...Object.values(glossary).filter(d=>d!==correctDef).sort(()=>Math.random()-0.5).slice(0,2)].sort(()=>Math.random()-0.5);
          let qhtml = `<p><strong>🧩 术语配对：</strong>"${escapeHtml(term)}" 的含义是？</p>`;
          opts.forEach((o,i) => qhtml += `<button class="quiz-option" data-correct="${escapeHtml(correctDef)}" onclick="appActions.checkAnswer(this,'${newsId}')">${i+1}. ${escapeHtml(o)}</button>`);
          qhtml += '<div id="quiz-feedback-' + newsId + '"></div>';
          area.innerHTML = qhtml;
        } else if (level === 'medium') {
          const otherTerms = matchedTerms.filter(t=>t!==term);
          const optionsTerms = [term, ...otherTerms.sort(()=>Math.random()-0.5).slice(0,2)].sort(()=>Math.random()-0.5);
          let qhtml = `<p><strong>🔍 根据释义选词：</strong>"${correctDef}" 对应的术语是？</p>`;
          optionsTerms.forEach((t,i) => qhtml += `<button class="quiz-option" data-correct="${escapeHtml(term)}" onclick="appActions.checkAnswer(this,'${newsId}')">${i+1}. ${escapeHtml(t)}</button>`);
          qhtml += '<div id="quiz-feedback-' + newsId + '"></div>';
          area.innerHTML = qhtml;
        } else if (level === 'hard') {
          const sentences = text.split(/[。.！!？?\n]/).filter(s => s.includes(term));
          if (sentences.length === 0) { area.innerHTML = '<p>无法生成填空</p>'; return; }
          const sentence = sentences[0].trim();
          const blankSentence = sentence.replace(term, '________');
          const distractTerms = matchedTerms.filter(t=>t!==term).sort(()=>Math.random()-0.5).slice(0,3);
          const termOptions = [term, ...distractTerms].sort(()=>Math.random()-0.5);
          let qhtml = `<p><strong>🎧 听力填空：</strong>点击播放，听出缺少的单词</p>`;
          qhtml += `<button onclick="appActions.speak('${escapeHtml(sentence)}','${currentLang}')">🔊 播放</button>`;
          qhtml += `<p style="margin:10px 0;">${escapeHtml(blankSentence)}</p>`;
          termOptions.forEach((t,i) => qhtml += `<button class="quiz-option" data-correct="${escapeHtml(term)}" onclick="appActions.checkAnswer(this,'${newsId}')">${i+1}. ${escapeHtml(t)}</button>`);
          qhtml += '<div id="quiz-feedback-' + newsId + '"></div>';
          area.innerHTML = qhtml;
        }
      },
      checkAnswer(btn, newsId) {
        const correct = btn.getAttribute('data-correct');
        const selected = btn.textContent.replace(/^\d+\.\s*/, '').trim();
        const feedbackDiv = document.getElementById('quiz-feedback-'+newsId);
        const siblings = btn.parentElement.querySelectorAll('.quiz-option');
        siblings.forEach(b => { b.disabled = true; b.classList.remove('correct','wrong'); });
        if (selected === correct) {
          btn.classList.add('correct');
          if (feedbackDiv) feedbackDiv.innerHTML = '✅ 正确！';
        } else {
          btn.classList.add('wrong');
          siblings.forEach(b => { if (b.textContent.replace(/^\d+\.\s*/,'').trim() === correct) b.classList.add('correct'); });
          if (feedbackDiv) feedbackDiv.innerHTML = '❌ 正确答案已标出。';
        }
      }
    };

    // ========== 从 API 加载新闻 ==========
    async function loadNews() {
      try {
        newsContainer.innerHTML = '<div class="loading-spinner">⏳ 正在加载今日新闻...</div>';
        const res = await fetch('/api/news');
        if (!res.ok) throw new Error('API error');
        newsDB = await res.json();
        const today = new Date().toLocaleDateString('zh-CN');
        document.getElementById('updateBadge').textContent = `✅ 更新于 ${today}`;
        refreshNews();
      } catch (e) {
        console.error('新闻加载失败', e);
        newsContainer.innerHTML = '<div class="loading-spinner">❌ 加载失败，请检查网络后刷新页面</div>';
        document.getElementById('updateBadge').textContent = '❌ 加载失败';
      }
    }

    function refreshNews() {
      const newsList = newsDB?.[currentLang]?.[currentTopic] || [];
      renderNews(newsList, currentLang);
    }

    // 语言切换
    tabJapanese.addEventListener('click', () => {
      currentLang = 'japanese';
      tabJapanese.classList.add('active'); tabEnglish.classList.remove('active');
      refreshNews();
    });
    tabEnglish.addEventListener('click', () => {
      currentLang = 'english';
      tabEnglish.classList.add('active'); tabJapanese.classList.remove('active');
      refreshNews();
    });

    // 主题切换
    topicTabs.forEach(tab => tab.addEventListener('click', () => {
      currentTopic = tab.dataset.topic;
      topicTabs.forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      refreshNews();
    }));

    // 初始化
    loadNews();

    // 注册 Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('/service-worker.js'));
    }
  })();
</script>
</body>
</html>
